version: '3.8'

services:
  db:
    image: postgres:16
    container_name: observatorio_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-observatorio_ia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./sql:/docker-entrypoint-initdb.d

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16
    container_name: observatorio_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-observatorio_ia}
      TZ: America/Guayaquil
      PGTZ: America/Guayaquil
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./etl/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-observatorio_ia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: observatorio_api_prod
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
      CORS_ORIGINS: ${CORS_ORIGINS:-https://biai.labtorres.me}
      SWAGGER_ENABLED: "false" # Deshabilitado en producción por seguridad
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: observatorio_frontend_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # Expuesto solo a localhost para tu túnel de Cloudflare nativo
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile.etl
    container_name: observatorio_etl_prod
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
    volumes:
      - ./etl/data:/app/data
      - ./etl/logs:/app/logs
      - ./etl/docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl

  etl-github:
    build:
      context: ./etl
      dockerfile: Dockerfile.etl
    container_name: observatorio_etl_github_prod
    entrypoint: ["python", "-m", "src.scripts.run_github_pipeline"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./etl/data:/app/data
      - ./etl/logs/github:/app/logs
      - ./etl/docs/github:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl-github

  etl-aidedev:
    build:
      context: ./etl
      dockerfile: Dockerfile.etl
    container_name: observatorio_etl_catalogo_prod
    entrypoint: ["python", "-m", "src.scripts.run_catalogo_pipeline"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
    volumes:
      - ./etl/data:/app/data
      - ./etl/logs/catalogo:/app/logs
      - ./etl/docs/catalogo:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl-aidedev
  etl-google-trends:
    build:
      context: ./etl
      dockerfile: Dockerfile.etl
    container_name: observatorio_etl_google_trends_prod
    entrypoint: ["python", "-m", "src.scripts.run_google_trends_pipeline"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
    volumes:
      - ./etl/data:/app/data
      - ./etl/logs/google_trends:/app/logs
      - ./etl/docs/google_trends:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl-google-trends
  etl-hackernews:
    build:
      context: ./etl
      dockerfile: Dockerfile.etl
    container_name: observatorio_etl_hackernews_prod
    entrypoint: ["python", "-m", "src.scripts.run_hackernews_pipeline"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-observatorio_ia}
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: America/Guayaquil
    volumes:
      - ./etl/data:/app/data
      - ./etl/logs/hackernews:/app/logs
      - ./etl/docs/hackernews:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl-hackernews

volumes:
  postgres_prod_data:
